name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from requires-python, plus the current release.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Editable so the tests run against the working tree. The wheel
        # install is exercised separately by the `wheel` job below.
        run: pip install -e ".[dev]"

      - name: Tool versions
        # Pinned in pyproject; echoed so a version drift is visible in the log
        # rather than showing up as an unexplained failure.
        run: |
          ruff --version
          mypy --version
          pytest --version

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests (pytest)
        run: pytest

  wheel:
    # Guards #10: templates/ must ship inside the wheel, so the package can
    # render an email with no source tree present. A parent-directory lookup
    # or a missing package-data rule passes every check above and fails only
    # here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install it into a clean venv, outside the source tree
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl

      - name: Render an email with no source tree in sight
        run: |
          mkdir -p /tmp/wheelcheck && cd /tmp/wheelcheck
          /tmp/wheelenv/bin/python - <<'PY'
          from pathlib import Path

          from svc.builder import EmailBuilder, FullWidth, TextBlock

          out = (
              EmailBuilder()
              .metadata(
                  {
                      "email_subject": "Wheel smoke test",
                      "firm_name": "CI",
                      "campaign_name": "wheel",
                  }
              )
              .section(FullWidth(content=TextBlock("<p>Rendered from a wheel.</p>")))
              .save(Path("out.html"))
          )
          assert "Rendered from a wheel." in out.read_text(), "template did not render"
          print(f"OK: {out} ({out.stat().st_size} bytes)")
          PY
