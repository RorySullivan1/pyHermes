name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from requires-python, plus the current release.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Editable so the tests run against the working tree. The wheel
        # install is exercised separately by the `wheel` job below.
        run: pip install -e ".[dev]"

      - name: Tool versions
        # Pinned in pyproject; echoed so a version drift is visible in the log
        # rather than showing up as an unexplained failure.
        run: |
          ruff --version
          mypy --version
          pytest --version

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests (pytest)
        run: pytest

  screenshots:
    # #59: renders the fixture gallery through headless Chromium and uploads
    # the PNGs, so a visual change can be reviewed without checking out the
    # branch. Its own job because it needs a browser -- the `check` job above
    # must keep passing with none installed, which is what proves the [qa]
    # extra is genuinely optional.
    #
    # PINNED here: viewport sizes, device scale factor, full-page capture, the
    # runner image. NOT pinned: the Chromium build, which comes from whatever
    # the pinned Playwright fetches. That is deliberate -- these images are
    # checks a human looks at, never diffed or committed, so each run records
    # the build that produced it in run.json instead. If pixel-diff gating is
    # ever wanted (an explicit non-goal of epic #54's first cut), that
    # recording is what says whether two sets are comparable, and pinning then
    # becomes a decision made on purpose rather than inherited by accident.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with the browser extra)
        run: pip install -e ".[dev,qa]"

      - name: Install Chromium
        # --with-deps pulls the shared libraries headless Chromium needs on a
        # bare runner. The build is whatever the pinned Playwright ships.
        run: playwright install --with-deps chromium

      - name: Screenshot tests
        # The capture half of tests/test_screenshots.py skips without a
        # browser, so this job is the only place it actually runs.
        run: pytest tests/test_screenshots.py

      - name: Render the gallery
        run: python -m qa.screenshots

      - name: What produced these images
        run: cat output/screenshots/run.json

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: output/screenshots/
          if-no-files-found: error

  wheel:
    # Guards #10: templates/ must ship inside the wheel, so the package can
    # render an email with no source tree present. A parent-directory lookup
    # or a missing package-data rule passes every check above and fails only
    # here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install it into a clean venv, outside the source tree
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl

      - name: Render an email with no source tree in sight
        run: |
          mkdir -p /tmp/wheelcheck && cd /tmp/wheelcheck
          /tmp/wheelenv/bin/python - <<'PY'
          from pathlib import Path

          from svc.builder import (
              ContactBlock,
              EmailBuilder,
              Footer,
              FullWidth,
              MinimalHeader,
              TextBlock,
              TwoColumn,
          )

          METADATA = {
              "email_subject": "Wheel smoke test",
              "firm_name": "CI",
              "campaign_name": "wheel",
          }

          out = (
              EmailBuilder()
              .metadata(METADATA)
              .footer(Footer(disclaimer="Wheel disclaimer."))
              .section(FullWidth(content=TextBlock("<p>Rendered from a wheel.</p>")))
              .section(FullWidth(content=ContactBlock(heading="Contact", cta_url="https://example.com/c")))
              .save(Path("out.html"))
          )
          html = out.read_text()
          assert "Rendered from a wheel." in html, "template did not render"
          assert "<v:rect" in html, "regions/header.html did not render"
          assert "<v:roundrect" in html, "text/contact-block.html did not render"
          assert "Wheel disclaimer." in html, "regions/footer.html disclaimer did not render"
          assert "Unsubscribe" in html, "regions/footer.html copyright/links did not render"
          print(f"OK: {out} ({out.stat().st_size} bytes)")

          # Every region template must ship, not just the default one.
          variant = (
              EmailBuilder()
              .metadata(METADATA)
              .header(MinimalHeader())
              .section(FullWidth(content=TextBlock("<p>Variant.</p>")))
              .save(Path("variant.html"))
          )
          vhtml = variant.read_text()
          assert "<v:rect" not in vhtml, "the minimal header rendered VML"
          assert "<v:roundrect" not in vhtml, "a footer with no contact card rendered a button"
          assert "Unsubscribe" in vhtml, "regions/footer.html did not render in the variant"
          print(f"OK: {variant} ({variant.stat().st_size} bytes)")

          # common/containers/columns.html ships, and its widths are computed
          # from the size scheme rather than hardcoded — so a non-default
          # density must move them. Guards #42/#43 from a clean install.
          def two_up(size_theme, name):
              return (
                  EmailBuilder()
                  .metadata({**METADATA, "size_theme": size_theme})
                  .section(
                      TwoColumn(
                          ratio="50-50",
                          left=TextBlock("<p>Left.</p>"),
                          right=TextBlock("<p>Right.</p>"),
                      )
                  )
                  .save(Path(name))
              ).read_text()

          standard, compact = two_up("standard", "standard.html"), two_up("compact", "compact.html")
          assert 'width="300"' in standard, "columns.html did not render at the shipped frame"
          assert 'width="300"' not in compact, "a size theme did not move the column geometry"
          assert "font-size:13px" in compact, "the compact type scale did not reach the email"
          print("OK: columns.html renders, and its geometry follows the size theme")
          PY
