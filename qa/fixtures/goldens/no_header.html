      .mobile-title { font-size:22px !important; }
      /* box-sizing is what keeps the padding *inside* the 100% width. Without it

         block, so the property it lacks costs Outlook nothing. */
      .kpi-cell { display:block !important; width:100% !important; box-sizing:border-box !important; border-right:none !important; border-bottom:1px solid #D6D2CB !important; padding:14px 16px !important; }

    [data-ogsc] .body-text,

    @media (prefers-color-scheme:dark) {

<!--
  ACADEMIC FINANCIAL EMAIL SKELETON — Design Reference
  ====================================================
  Palette:
    Every colour and shadow comes from the resolved Theme, which arrives as
    the "theme" namespace. The token table — name, value, and the sites each
    one covers — lives in svc/builder/theming.py, where something other than
    a person can read it. The hand-maintained list that used to sit here had
    already drifted: it named a row-alt colour the table never used.
-->

  </div>

              <![endif]-->
              <div style="background-color:#2C3E50; background-size:cover;
                          background-position:center center; background-repeat:no-repeat;">
                <!-- Dark overlay for text legibility.  Hidden from Outlook on
                     purpose: the v:fill above already applies this exact scrim
                     through its own color + opacity attributes, and the Word
                     engine demotes a transparent background-color to a
                     background image, inheriting VML's limitations for a
                     second copy of an effect it has already drawn (#78).
                     Both halves still read one Rgba, so they cannot drift. -->
                <!--[if !mso]><!--><div style="background-color:rgba(20,30,44,0.65);"><!--<![endif]-->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                    <td width="100%" valign="bottom" style="padding:18px 0 6px 32px;">

                         class="mobile-title">

                    </td>

                        no-header

                <!--[if !mso]><!--></div><!--<![endif]--><!-- /dark overlay -->

                </v:textbox>

  <td style="padding:0; background-color:#FFFFFF;">
