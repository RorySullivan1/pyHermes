<head>
  <meta charset="UTF-8">

  <title>Minimal</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings></xml>
  </noscript>
  <style type="text/css">
    body, td, th { font-family: Georgia, 'Times New Roman', serif; }
    body { background-color: #F2F1EE !important; }
  </style>
  <![endif]-->
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { -ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; }
    @media only screen and (max-width:700px) {
      .email-container { width:100% !important; }
      .stack-column { display:block !important; width:100% !important; }
      .mobile-pad { padding:20px 18px !important; }
      .mobile-title { font-size:22px !important; }
      /* box-sizing is what keeps the padding *inside* the 100% width. Without it
         the content-box default adds it on top and the cell overflows the
         viewport by its own padding (#76). Word ignores this whole @media
         block, so the property it lacks costs Outlook nothing. */
      .kpi-cell { display:block !important; width:100% !important; box-sizing:border-box !important; border-right:none !important; border-bottom:1px solid #D6D2CB !important; padding:14px 16px !important; }
      .kpi-cell-last { border-bottom:none !important; }
      /* A data table cannot collapse — stacking its columns would destroy the
         alignment that is the only reason to render one — so padding is what
         gives a narrow viewport its room back. See #132. */
      .data-table th, .data-table td { padding:6px !important; }
    }
    /* Force light rendering in all dark mode contexts */
    :root { color-scheme: light only; }
    [data-ogsc] .email-container,
    [data-ogsb] .email-container { background-color:#FFFFFF !important; }
    [data-ogsc] .surface,
    [data-ogsb] .surface { background-color:#FFFFFF !important; }
    [data-ogsc] .body-text,
    [data-ogsb] .body-text { color:#3B3B3B !important; }
    @media (prefers-color-scheme:dark) {
      .email-container { background-color:#FFFFFF !important; }
      .body-text { color:#3B3B3B !important; }
      .surface { background-color:#FFFFFF !important; }
    }
  </style>
</head>
