{#
  CHART BLOCK — Image/chart with source attribution.

  Context:
    chart_image_url — Full URL to the chart image
    chart_alt_text  — Alt text for accessibility
    chart_source    — Attribution string (optional)
#}
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
  <tr>
    <td style="padding: 0;">
      <img src="{{ chart_image_url }}" alt="{{ chart_alt_text }}" width="100%" style="display: block; max-width: 100%; border: 1px solid #D6D2CB; margin: 0;">
    </td>
  </tr>
</table>
{% if chart_source %}
<p style="font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; color: #A09E97; font-style: italic; margin: 8px 0 0 0;">{{ chart_source }}</p>
{% endif %}
