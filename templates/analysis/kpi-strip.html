{#
  KPI STRIP — Row of 2–4 key performance indicators.

  Context:
    kpis — List of dicts with keys: label, value, color, sublabel
#}
{% set col_width = (100 / kpis | length) | round(2) %}
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse; border: 1px solid #D6D2CB;">
  <tr>
{% for kpi in kpis %}
    <td class="kpi-cell{% if loop.last %} kpi-cell-last{% endif %}" style="width: {{ col_width }}%;{% if not loop.last %} border-right: 1px solid #D6D2CB;{% endif %} padding: 16px 12px; text-align: center; background-color: #FFFFFF;">
      <p style="font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; color: #7A7A72; text-transform: uppercase; margin: 0 0 6px 0; letter-spacing: 0.5px; font-weight: bold;">{{ kpi.label }}</p>
      <p style="font-family: Georgia, 'Times New Roman', serif; font-size: 21px; font-weight: bold; color: {{ kpi.color }}; margin: 0 0 4px 0; line-height: 1.2;">{{ kpi.value }}</p>
      <p style="font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; color: #A09E97; margin: 0; line-height: 1.4;">{{ kpi.sublabel }}</p>
    </td>
{% endfor %}
  </tr>
</table>
