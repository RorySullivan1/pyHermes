[project]
name = "pyhermes"
version = "0.1.0"
description = "Academic financial newsletter HTML email builder."
requires-python = ">=3.11"
authors = [
    { name = "Rory Sullivan", email = "accounts@roryjsullivan.com" },
]
dependencies = [
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Compatible-release pins (~=): patch upgrades yes, minor no. An unbounded
    # "ruff>=0.6" let CI resolve 0.16, which stabilised Markdown code-block
    # formatting and failed the build on CLAUDE.md with no code change --
    # a green local run and a red CI run from the same commit.
    "ruff~=0.16.3",
    "mypy~=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_builder.py stays the end-to-end smoke test and is run separately;
# it writes weekly_market_wrap_v2.html as a side effect.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/ is the vendored claudeBrain asset library, regenerated by its own
# generators (build-hooks.py, catalog.py) — not this project's source.
#
# *.md: ruff >=0.16 formats Python code blocks inside Markdown. Left on, it
# expands CLAUDE.md's public-API import into a 12-line parenthesised block —
# worse as documentation, and it puts prose under a code formatter's control.
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus import sorting and bugbear.
# Deliberately NOT enabling UP (pyupgrade): it flags ~55 typing-modernization
# rewrites (Optional[X] -> X | None, List -> list) across every module. That is
# a worthwhile pass but its own change — bundling it here would bury the CI
# setup in an unrelated refactor.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["svc"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
