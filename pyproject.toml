[project]
name = "pyhermes"
version = "0.1.0"
description = "Build a research document once, then send it as an email or print it as a PDF or brochure."
readme = "README.md"
# An SPDX expression (PEP 639) rather than a licence classifier, which the
# expression supersedes; the text ships as LICENSE in both artefacts.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Rory Sullivan", email = "accounts@roryjsullivan.com" },
]
keywords = ["email", "html email", "newsletter", "pdf", "research", "jinja2", "outlook", "gmail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Compatible-release pins (~=): patch upgrades yes, minor no. An unbounded
    # "ruff>=0.6" let CI resolve 0.16, which stabilised Markdown code-block
    # formatting and failed the build on CLAUDE.md with no code change --
    # a green local run and a red CI run from the same commit.
    "ruff~=0.16.3",
    "mypy~=1.19.1",
    # The HTTP transports the send adapters *document* -- not ones they use.
    # pyhermes/gmail and pyhermes/outlook import neither (an AST test in each enforces
    # that), so these stay out of `dependencies` and pyHermes still installs
    # with Jinja2 alone. They are here because the adapters' retry
    # classification turns on real exception hierarchies -- requests'
    # ConnectionError is an OSError but *not* the builtin ConnectionError,
    # and httplib2's ServerNotFoundError is neither -- and a bug that shipped
    # precisely because the tests only ever injected builtins. Synthesising
    # look-alike classes would rebuild that blind spot.
    "requests>=2.31",
    "httplib2>=0.22",
]

# Screenshots (#59) are a separate extra, not part of the dev floor: they need
# a browser, and `pip install -e ".[dev]"` plus `pytest` must stay browser-free
# so the core suite runs anywhere. tests/test_screenshots.py skips when this is
# absent rather than failing.
#
# The *package* is pinned for API stability, in the same spirit as ruff and
# mypy above. It deliberately does NOT pin the browser build: these images are
# checks a human looks at, never diffed or committed, so each run records the
# Chromium build that produced it instead (see qa/screenshots.py).
qa = [
    "playwright~=1.62.0",
    # Rasterises a PDF page to PNG, for the paged half of the gallery (#165).
    # A self-contained wheel on purpose: going through Poppler would add a
    # *system* binary to an extra that is meant to be `pip install` and
    # nothing else, which is the whole reason [qa] is separable.
    "pypdfium2~=5.13",
]

# The PDF exporter (#164) is a third extra, on the [qa] reasoning exactly: it
# needs Pango and Cairo from the system, and `pip install -e ".[dev]"` plus
# `pytest` must stay installable anywhere. tests/test_pdf.py skips when this is
# absent rather than failing, which is what proves the extra is optional.
#
# Pinned to 70.x deliberately rather than loosely. WeasyPrint 70 replaced the
# url_fetcher contract: a fetcher is now a `URLFetcher` subclass returning a
# `URLFetcherResponse`, where every earlier version took a plain callable
# returning a dict. pyhermes/pdf/fetcher.py is written against the new one, so a
# `>=` range spanning the change would resolve to a version this code cannot
# drive -- and it is the fetcher that carries the no-network policy, so the
# failure would land on the security-relevant part.
pdf = [
    "weasyprint~=70.0",
]

# The data adapters (pyhermes/data, #179 and #180). Two extras rather than one: a
# table author should not have to install a plotting library to adapt a frame.
data = [
    "pandas~=3.0",
]

charts = [
    "matplotlib~=3.11",
]

# The equation renderer (pyhermes/math, #230). Its own extra for the [data]/[charts]
# reason: an equation author is not a chart author. Same pin as [charts].
math = [
    "matplotlib~=3.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/RorySullivan1/pyHermes"
Repository = "https://github.com/RorySullivan1/pyHermes"
Issues = "https://github.com/RorySullivan1/pyHermes/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyhermes"]

# The sdist is the library and nothing else. Hatchling's default takes every
# file git does not ignore, which would ship .claude/, tests/ and its goldens,
# qa/, examples/, drafts/ and docs/. qa/distribution.py fails CI on any path
# outside this list.
[tool.hatch.build.targets.sdist]
only-include = ["pyhermes", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/ is the vendored claudeBrain asset library, regenerated by its own
# generators (build-hooks.py, catalog.py) — not this project's source.
#
# *.md: ruff >=0.16 formats Python code blocks inside Markdown. Left on, it
# expands CLAUDE.md's public-API import into a 12-line parenthesised block —
# worse as documentation, and it puts prose under a code formatter's control.
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus import sorting, bugbear, pyupgrade and
# line length. UP is safe to enforce because requires-python is >=3.11, so the
# PEP 604 (X | None) and PEP 585 (list[str]) forms are available everywhere.
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
# qa/ is first-party importable code (the #54 fixture gallery and the tools
# that consume it), so it is type-checked like pyhermes/. It is excluded from the
# wheel by the packages setting above, not by being untyped.
files = ["pyhermes", "qa"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Playwright is the optional [qa] extra, so it is deliberately absent from the
# environment mypy runs in: CI's `check` job installs [dev] only, which is what
# keeps the core suite browser-free. Without this, mypy is green on a machine
# that happens to have a browser installed and red in CI from the same commit --
# the same green-local/red-CI trap the ruff pin above records.
#
# This block must stay BELOW every global flag above. A per-module section
# captures every key that follows it, so placing it mid-section silently moves
# global strictness flags into the override -- weakening the whole type-check
# while still reporting success. mypy warns about that; the warning is the only
# thing that shows it.
[[tool.mypy.overrides]]
# Both spellings per package: a `foo.*` pattern matches submodules, not the
# top-level module, so `import pypdfium2` needs the bare name as well.
module = [
    "playwright",
    "playwright.*",
    "weasyprint",
    "weasyprint.*",
    "pypdfium2",
    "pypdfium2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The data adapters' backends are skipped, not merely allowed to be missing.
# pyhermes/data types every backend as Any, so nothing is lost by not reading them,
# and reading them is what breaks: matplotlib ships its own annotations, mypy
# follows them into numpy, and numpy 2.5's stubs use the 3.12 `type` statement
# this project cannot parse at python_version 3.11. That failed only where
# the extras were installed, the green-local/red-CI trap again. Skipping makes
# the installed and absent cases the same check. numpy comes in transitively.
module = [
    "pandas",
    "pandas.*",
    "matplotlib",
    "matplotlib.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
# follow_imports is ignored for .pyi stubs by default, and matplotlib and numpy
# ship .pyi stubs, so without this line the skip does nothing for them.
follow_imports_for_stubs = true
