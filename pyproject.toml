[project]
name = "pyhermes"
version = "0.1.0"
description = "Academic financial newsletter HTML email builder."
requires-python = ">=3.11"
authors = [
    { name = "Rory Sullivan", email = "accounts@roryjsullivan.com" },
]
dependencies = [
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_builder.py stays the end-to-end smoke test and is run separately;
# it writes weekly_market_wrap_v2.html as a side effect.
addopts = "-q"
