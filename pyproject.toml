[project]
name = "pyhermes"
version = "0.1.0"
description = "Academic financial newsletter HTML email builder."
requires-python = ">=3.11"
authors = [
    { name = "Rory Sullivan", email = "accounts@roryjsullivan.com" },
]
dependencies = [
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_builder.py stays the end-to-end smoke test and is run separately;
# it writes weekly_market_wrap_v2.html as a side effect.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/ is the vendored claudeBrain asset library, regenerated by its own
# generators (build-hooks.py, catalog.py) — not this project's source.
extend-exclude = [".claude"]

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus import sorting and bugbear.
# Deliberately NOT enabling UP (pyupgrade): it flags ~55 typing-modernization
# rewrites (Optional[X] -> X | None, List -> list) across every module. That is
# a worthwhile pass but its own change — bundling it here would bury the CI
# setup in an unrelated refactor.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["svc"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# svc/assembler.py is the legacy flat assembler, untyped and slated for
# removal in #14.  Held to the baseline rather than the builder's standard.
module = "svc.assembler"
disallow_untyped_defs = false
disallow_incomplete_defs = false
