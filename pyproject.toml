[project]
name = "pyhermes"
version = "0.1.0"
description = "Academic financial newsletter HTML email builder."
requires-python = ">=3.11"
authors = [
    { name = "Rory Sullivan", email = "accounts@roryjsullivan.com" },
]
dependencies = [
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Compatible-release pins (~=): patch upgrades yes, minor no. An unbounded
    # "ruff>=0.6" let CI resolve 0.16, which stabilised Markdown code-block
    # formatting and failed the build on CLAUDE.md with no code change --
    # a green local run and a red CI run from the same commit.
    "ruff~=0.16.3",
    "mypy~=1.19.1",
    # The HTTP transports the send adapters *document* -- not ones they use.
    # svc/gmail and svc/outlook import neither (an AST test in each enforces
    # that), so these stay out of `dependencies` and pyHermes still installs
    # with Jinja2 alone. They are here because the adapters' retry
    # classification turns on real exception hierarchies -- requests'
    # ConnectionError is an OSError but *not* the builtin ConnectionError,
    # and httplib2's ServerNotFoundError is neither -- and a bug that shipped
    # precisely because the tests only ever injected builtins. Synthesising
    # look-alike classes would rebuild that blind spot.
    "requests>=2.31",
    "httplib2>=0.22",
]

# Screenshots (#59) are a separate extra, not part of the dev floor: they need
# a browser, and `pip install -e ".[dev]"` plus `pytest` must stay browser-free
# so the core suite runs anywhere. tests/test_screenshots.py skips when this is
# absent rather than failing.
#
# The *package* is pinned for API stability, in the same spirit as ruff and
# mypy above. It deliberately does NOT pin the browser build: these images are
# checks a human looks at, never diffed or committed, so each run records the
# Chromium build that produced it instead (see qa/screenshots.py).
qa = [
    "playwright~=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/ is the vendored claudeBrain asset library, regenerated by its own
# generators (build-hooks.py, catalog.py) — not this project's source.
#
# *.md: ruff >=0.16 formats Python code blocks inside Markdown. Left on, it
# expands CLAUDE.md's public-API import into a 12-line parenthesised block —
# worse as documentation, and it puts prose under a code formatter's control.
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus import sorting, bugbear, pyupgrade and
# line length. UP is safe to enforce because requires-python is >=3.11, so the
# PEP 604 (X | None) and PEP 585 (list[str]) forms are available everywhere.
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
# qa/ is first-party importable code (the #54 fixture gallery and the tools
# that consume it), so it is type-checked like svc/. It is excluded from the
# wheel by the packages setting above, not by being untyped.
files = ["svc", "qa"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Playwright is the optional [qa] extra, so it is deliberately absent from the
# environment mypy runs in: CI's `check` job installs [dev] only, which is what
# keeps the core suite browser-free. Without this, mypy is green on a machine
# that happens to have a browser installed and red in CI from the same commit --
# the same green-local/red-CI trap the ruff pin above records.
#
# This block must stay BELOW every global flag above. A per-module section
# captures every key that follows it, so placing it mid-section silently moves
# global strictness flags into the override -- weakening the whole type-check
# while still reporting success. mypy warns about that; the warning is the only
# thing that shows it.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
