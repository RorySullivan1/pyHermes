[project]
name = "pyhermes"
version = "0.1.0"
description = "Academic financial newsletter HTML email builder."
requires-python = ">=3.11"
authors = [
    { name = "Rory Sullivan", email = "accounts@roryjsullivan.com" },
]
dependencies = [
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svc"]
