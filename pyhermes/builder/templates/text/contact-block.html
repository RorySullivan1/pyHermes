{# CONTACT CALL-TO-ACTION — a body component (was the footer's contact card). #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="border:1px solid {{ theme.palette.rule }}; border-radius:4px;">
  <tr>
    <td{% if align %} align="{{ align | escape_html }}"{% endif %} style="padding:{{ size.component.contact_pad_y }}px {{ size.component.contact_pad_x }}px;{% if align %} text-align:{{ align }};{% endif %}">
      <p style="margin:0; font-family: {{ font.heading }}; font-size:{{ size.type.subheading }}px;
                font-weight:bold; color:{{ theme.text.heading }}; letter-spacing:0.2px;">
        {{ contact_heading | escape_html }}
      </p>
      <p style="margin:{{ size.component.contact_heading_gap }}px 0 {{ size.component.contact_cta_gap }}px; font-family: {{ font.label }}; font-size:{{ size.type.secondary }}px;
                color:{{ theme.text.secondary }}; line-height:{{ size.component.contact_line | percent }};">
        {{ contact_description | escape_html }}
      </p>
      {% set button_url, button_label = contact_url, contact_cta_label %}{% include "common/cta.html" %}
    </td>
  </tr>
</table>
