# epic-autoclose: keep a parent issue's state in step with its sub-issues.
#
# Install by copying this file to .github/workflows/epic-autoclose.yml.
#   - A sub-issue closes and every sibling is closed: close the parent. It closes as
#     "completed" if any child completed, otherwise "not planned".
#   - A sub-issue reopens under a closed parent: reopen the parent.
# Nested epics cascade inside ONE run. Events caused by GITHUB_TOKEN do not start new
# workflow runs, so closing a parent here would never trigger a run for the grandparent.
# The token is scoped to this repository. A parent that lives in another repository is
# reported and left alone.
# Probed against a fake API: .claude/skills/github-issues/probes/probe_epic_autoclose.py
name: epic-autoclose

on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write

jobs:
  sync-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Sync parent epic state
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)

          # api METHOD PATH [JSON] -> response body in $tmp/body, HTTP status on stdout.
          api() {
            local args=(-sS -o "$tmp/body" -w '%{http_code}' -X "$1"
              -H "Authorization: Bearer $GH_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28")
            [ $# -ge 3 ] && args+=(-H "Content-Type: application/json" -d "$3")
            curl "${args[@]}" "$API/$2"
          }
          must() {  # like api, but any non-2xx status fails the run loudly
            local status; status=$(api "$@")
            case "$status" in 2??) ;; *) echo "::error::$1 $2 -> HTTP $status: $(cat "$tmp/body")"; exit 1 ;; esac
          }

          child=$ISSUE
          for _ in 1 2 3 4 5 6 7 8; do  # GitHub nests sub-issues at most eight levels deep
            status=$(api GET "repos/$REPO/issues/$child/parent")
            if [ "$status" = 404 ]; then echo "#$child has no parent; done."; exit 0; fi
            case "$status" in 2??) ;; *) echo "::error::parent lookup for #$child -> HTTP $status: $(cat "$tmp/body")"; exit 1 ;; esac

            parent=$(jq -r .number "$tmp/body")
            pstate=$(jq -r .state "$tmp/body")
            prepo=$(jq -r .repository_url "$tmp/body")
            if [ "${prepo,,}" != "${API,,}/repos/${REPO,,}" ]; then  # owner/repo names are case-insensitive
              echo "::notice::#$child's parent is in $prepo; this token cannot write there. Left alone."
              exit 0
            fi

            if [ "$ACTION" = reopened ]; then
              if [ "$pstate" = open ]; then echo "Parent #$parent is already open; done."; exit 0; fi
              must PATCH "repos/$REPO/issues/$parent" '{"state":"open"}'
              must POST "repos/$REPO/issues/$parent/comments" \
                "$(jq -n --arg b "Reopened automatically: sub-issue #$child was reopened." '{body:$b}')"
              echo "Reopened #$parent."
              child=$parent; continue
            fi

            if [ "$pstate" != open ]; then echo "Parent #$parent is already closed; done."; exit 0; fi
            must GET "repos/$REPO/issues/$parent/sub_issues?per_page=100"  # 100 is GitHub's per-parent cap
            total=$(jq length "$tmp/body")
            open=$(jq '[.[] | select(.state == "open")] | length' "$tmp/body")
            completed=$(jq '[.[] | select(.state_reason == "completed")] | length' "$tmp/body")
            if [ "$open" -gt 0 ]; then echo "#$parent: $open of $total sub-issues still open; done."; exit 0; fi

            reason=not_planned; [ "$completed" -gt 0 ] && reason=completed
            must PATCH "repos/$REPO/issues/$parent" "{\"state\":\"closed\",\"state_reason\":\"$reason\"}"
            must POST "repos/$REPO/issues/$parent/comments" \
              "$(jq -n --arg b "Closed automatically ($reason): all $total sub-issues are closed; the last was #$child." '{body:$b}')"
            echo "Closed #$parent as $reason."
            child=$parent
          done
