<!doctype html>
<!-- POSITIVE CONTROL for --strict-fetch: every asset lives at or below this directory,
     so nothing resolves through `../`. This is the shape a strict-fetch bundle must have.
     base_url does double duty - it resolves relative URLs AND is the strict-fetch root -
     so widening it to reach a sibling assets/ dir breaks the template's own paths. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="doc.css"></head>
<body>
  <h1>Self-contained control</h1>
  <table><thead><tr><th>Period</th><th>Return</th></tr></thead>
  <tbody><tr><td>1M</td><td>1.2%</td></tr></tbody></table>
</body></html>
