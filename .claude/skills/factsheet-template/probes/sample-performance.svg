<?xml version="1.0" encoding="UTF-8"?>
<!--
  GEOMETRIC PLACEHOLDER — not a performance chart and not data.

  Its only job is to occupy the exact space a real chart occupies, so the factsheet's
  pagination can be regression-tested. The viewBox is 510 x 184 pt = 180mm x 65mm, the
  same footprint as a matplotlib figure at figsize=(7.087, 2.56) inches, which is what the
  layout was measured against.

  Shapes only, no <text>: chart text must be outlines (matplotlib's svg.fonttype='path'
  default) so it does not depend on fonts installed on the rendering host. A placeholder
  with live text would contradict the rule this skill teaches.

  Replace with a real pre-rendered chart from the data layer. See references/layout-spec.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 184" width="510" height="184">
  <rect x="0" y="0" width="510" height="184" fill="#ffffff"/>
  <g stroke="#dfe5ec" stroke-width="0.6">
    <line x1="34" y1="26"  x2="502" y2="26"/>
    <line x1="34" y1="65"  x2="502" y2="65"/>
    <line x1="34" y1="104" x2="502" y2="104"/>
    <line x1="34" y1="143" x2="502" y2="143"/>
  </g>
  <line x1="34" y1="160" x2="502" y2="160" stroke="#7c848f" stroke-width="0.8"/>
  <line x1="34" y1="16"  x2="34"  y2="160" stroke="#7c848f" stroke-width="0.8"/>
  <polyline fill="none" stroke="#1f4e79" stroke-width="1.4"
    points="34,148 73,140 112,145 151,128 190,132 229,116 268,120 307,101 346,108 385,86 424,92 463,70 502,62"/>
  <g fill="#c8ccd2">
    <rect x="34"  y="168" width="66" height="3"/>
    <rect x="120" y="168" width="52" height="3"/>
    <rect x="192" y="168" width="60" height="3"/>
  </g>
</svg>
