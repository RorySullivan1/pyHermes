          <!-- ══════════════════════════════════════════ -->
          <!-- HEADER (minimal): Disclaimer bar          -->
          <!-- ══════════════════════════════════════════ -->
          <tr>
            <td style="background-color:{{ theme.palette.header_bg }}; padding:7px 32px; text-align:center;" bgcolor="{{ theme.palette.header_bg }}">
              <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:9.5px;
                        font-weight:300; color:{{ theme.text.on_dark_muted }}; letter-spacing:0.3px; line-height:1.4;">
                {{header_disclaimer}}
              </p>
            </td>
          </tr>

          <!-- ══════════════════════════════════════════ -->
          <!-- HEADER (minimal): Flat band, no VML       -->
          <!-- ══════════════════════════════════════════ -->
          <tr>
            <td style="background-color:{{ theme.palette.header_bg }};" bgcolor="{{ theme.palette.header_bg }}">
              <!-- Logo row.  One <img>, not the default header's mso/non-mso
                   pair: that pair exists because max-width misbehaves inside
                   a v:textbox, and there is no v:textbox here.  Outlook
                   ignores max-width and reads the width attribute. -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:18px 32px 0;" align="right">
                    <img src="{{ logo_url | escape_html }}" width="{{ logo_width }}" alt="{{ logo_alt | escape_html }}"
                         style="display:block; max-width:{{ logo_width }}px; height:auto;">
                  </td>
                </tr>
              </table>
              <!-- Firm name + campaign name.  No text-shadow: it buys
                   legibility over a photograph, and there is no photograph. -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:10px 32px 6px;">
                    <p style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:28px;
                              font-weight:bold; color:{{ theme.text.on_dark }}; line-height:1.2; letter-spacing:0.3px;"
                       class="mobile-title">
                      {{ firm_name | escape_html }}
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 32px 8px;">
                    <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:13px;
                              font-weight:400; color:{{ theme.text.on_dark_secondary }}; line-height:1.3;">
                      {{ campaign_name | escape_html }}
                    </p>
                  </td>
                </tr>
              </table>
              <!-- Accent rule -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:0 32px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="border-top:2px solid {{ theme.palette.accent }}; font-size:0; line-height:0;" height="1">&nbsp;</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <!-- Date / Issue bar -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:10px 32px 18px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-family:Arial,Helvetica,sans-serif; font-size:11px;
                                   color:{{ theme.text.on_dark_muted }}; letter-spacing:0.6px; text-transform:uppercase;">
                          {{ date_range | escape_html }}
                        </td>
                        <td align="right" style="font-family:Arial,Helvetica,sans-serif; font-size:11px;
                                                  color:{{ theme.text.on_dark_muted }}; letter-spacing:0.6px; text-transform:uppercase;">
                          {{ issue_label | escape_html }}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
