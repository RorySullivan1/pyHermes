<!DOCTYPE html>
<html lang="{{ language | escape_html }}">
<head>
  <meta charset="UTF-8">
  <title>{{ campaign_name | escape_html }}</title>
  <style type="text/css">
    {# The page itself. `size` takes the paper; a continuous page declares a
       width only and runs as long as its content. Horizontal margin is zero
       because the containers already inset their copy by frame.pad_x, and
       adding it here too would inset twice -- the #85 mistake, one layer up. #}
    @page {
      size: {{ size.frame.width }}px{% if size.frame.height %} {{ size.frame.height }}px{% endif %};
      margin: {{ size.frame.outer_pad_y }}px 0;
    }

    {# The running margin boxes, each filled by its own region. They are CSS
       rather than markup, which is why these two slots land here rather than
       in the body -- see document/regions/running-box.html. #}
{{ running_header_html }}
{{ running_footer_html }}

    {# The cover claims a named page so the folio and the running head do not
       appear on it. A zero margin renders no margin box at all, which is the
       shortest way to say "not here" without repeating every box by name. #}
    @page cover { margin: 0; }

    body {
      margin: 0;
      padding: 0;
      background-color: {{ theme.palette.surface }};
      font-family: {{ font.body }};
      color: {{ theme.text.primary }};
      {# The CSS initial values, stated: every paragraph inherits them. #}
      orphans: 2;
      widows: 2;
    }
    table { border-collapse: collapse; }

    {# A print engine honours the CSS `width` property; the `width` HTML
       attribute on a table is a presentational hint it does not map, where a
       browser does. The component templates carry widths as attributes
       because Outlook's Word engine reads nothing else -- so without this the
       shared markup renders correctly and shrink-wraps every table to its
       content, measured at 188px inside a 794px page. #}
    table[width="100%"] { width: 100%; }
    img { border: 0; }

    {# Where a sheet may not end (#169). Each rule sits on the thing that must
       not split, never on a table that may be taller than a sheet: `avoid`
       on one of those pushes it whole to the next sheet and strands a
       half-empty one. The email never loads this skeleton, so the rules cost
       it nothing; the class hooks are the shared markup's only share.
       Both spellings travel together, as in page.html. #}
    .data-table tbody tr { break-inside: avoid; page-break-inside: avoid; }
    .data-table tr.row-total { break-before: avoid; page-break-before: avoid; }
    .data-table tr.row-subhead { break-after: avoid; page-break-after: avoid; }
    .data-table > caption { break-after: avoid; page-break-after: avoid; }
    {# A section title is a sibling table to its content, not its parent,
       so the rule goes on the title's table and the engine moves the title
       to the next sheet with the first line of what it heads. #}
    .section-title { break-after: avoid; page-break-after: avoid; }
    .fine-print { break-before: avoid; page-break-before: avoid; }
    .figure { break-inside: avoid; page-break-inside: avoid; }
  </style>
</head>
<body>

{{ cover_html }}

  {# The body table is frame.width, not frame.inner: every container computes
     its column widths from the frame and pads inside that, so narrowing the
     table here would overflow each split by its own padding. #}
  <table class="document-container" role="presentation" width="{{ size.frame.width }}"
         cellpadding="0" cellspacing="0" border="0"
         style="width:{{ size.frame.width }}px; background-color:{{ theme.palette.surface }};">
{{ sections_html }}
  </table>

{{ back_matter_html }}

</body>
</html>
